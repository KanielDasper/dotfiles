bind C-s send-prefix

# General 
set -g prefix C-s
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g allow-passthrough on
set -g focus-events on
setw -g aggressive-resize on

# Bindings
unbind '"'
unbind %
unbind r

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind v split-window -h
bind b split-window -v
bind t new-session -A -s default


# Appearance
set -g status-position top
set -g status-justify absolute-centre
set -g status-style fg=colour8,bg=default
set -g status-left ' '
set -g status-right '[ #S ]'
setw -g window-status-current-style fg=colour15,bg=default,bold
setw -g window-status-current-format ' [#I:#W] '
setw -g window-status-style fg=colour8

# Plugins
set -g @plugin 'tmux-plugins/tpm' # must be the first plugin
set -g @plugin "tmux-plugins/tmux-resurrect" 
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @continuum-restore "on"


# always keep these lines last
set-environment -g TMUX_PLUGIN_MANAGER_PATH ~/.config/tmux/plugins
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
run '~/dotfiles/tmux/plugins/tpm/tpm' 
